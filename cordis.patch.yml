- insert:
    - id: browsermcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: browsermcp
        transport: stdio
        command: !!js >-
          (process.platform === 'win32' ? process.env.USERPROFILE : process.env.HOME) +
          '/.browsermcp/bin/browsermcp-launcher' +
          (process.platform === 'win32' ? '.cmd' : '')
        args: ['stdio']
        env: {}
        cwd: !!js process.cwd()
