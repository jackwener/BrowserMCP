- insert:
    - id: browsermcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: browsermcp
        transport: stdio
        command: !!js >-
          process.env.BROWSERMCP_BIN ||
          process.env.OPENCLI_MCP_BIN ||
          (process.platform === 'win32' ? process.env.USERPROFILE : process.env.HOME) +
          '/.opencli-mcp/bin/opencli-mcp-launcher' +
          (process.platform === 'win32' ? '.cmd' : '')
        args: ['stdio']
        env: {}
        cwd: !!js process.cwd()
